name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      # Tests marked @pytest.mark.live (real ELI API / LLM) are deselected by default (pyproject addopts).
      - name: Run tests
        run: uv run pytest -q
