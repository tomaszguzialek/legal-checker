[project]
name = "legal-checker"
version = "0.1.0"
description = "PoC: AI Legal & Compliance Checker for Polish company documents against acts from the Sejm ELI API"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.0",
    "httpx>=0.27",
    "pymupdf>=1.24",
    "beautifulsoup4>=4.12",
    "rank-bm25>=0.2.2",
    "langchain>=1.0",
    "langchain-core>=1.0",
    "langgraph>=1.0",
    "python-dotenv>=1.0",
    "rich>=13.0",
]

[project.optional-dependencies]
anthropic = ["langchain-anthropic"]
openai = ["langchain-openai"]
google = ["langchain-google-genai"]
groq = ["langchain-groq"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/legal_checker"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Tests against real external services are opt-in: uv run pytest -m live
addopts = "-m 'not live'"
markers = ["live: calls real external services (Sejm ELI API, LLM provider); deselected by default"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
